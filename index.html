<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Exam Portal</title>
<style>
/* Basic page styling */
body {
  font-family: Arial, sans-serif;
  background: #f4f6f8;
  margin: 0;
}

/* Header */
header {
  background: #2563eb;
  color: white;
  padding: 15px;
  text-align: center;
}

/* Layout */
.container {
  display: flex;
  min-height: 100vh;
}

/* Sidebar */
nav {
  width: 220px;
  background: #1e293b;
  color: white;
  padding: 20px;
}

nav button {
  width: 100%;
  margin: 10px 0;
  padding: 10px;
  background: #334155;
  border: none;
  color: white;
  cursor: pointer;
  border-radius: 4px;
}

nav button:hover {
  background: #475569;
}

/* Main content */
main {
  flex: 1;
  padding: 30px;
}

/* Cards */
.card {
  background: white;
  padding: 20px;
  border-radius: 6px;
  max-width: 750px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}

/* Form elements */
label {
  display: block;
  margin-top: 12px;
}

input, select {
  width: 100%;
  padding: 8px;
  margin-top: 5px;
}

/* Buttons */
.submit-btn {
  margin-top: 20px;
  background: #2563eb;
  color: white;
  padding: 10px;
  border: none;
  width: 100%;
  border-radius: 4px;
  cursor: pointer;
}

.delete-btn {
  background: red;
  color: white;
  border: none;
  padding: 5px 8px;
  cursor: pointer;
}

/* Table */
table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 20px;
}

th, td {
  border: 1px solid #ddd;
  padding: 8px;
  text-align: center;
}

th {
  background: #e5e7eb;
}

/* Search input */
.search {
  width: 100%;
  padding: 8px;
  margin-bottom: 10px;
}

/* Utility */
.hidden {
  display: none;
}
</style>
</head>

<body>

<header>
  <h1>Student Exam Portal</h1>
</header>

<div class="container">

<!-- Sidebar -->
<nav>
  <button onclick="showForm()">Exam Form</button>
  <button onclick="showDashboard()">Student Dashboard</button>
</nav>

<main>
<!-- ===================== FORM SECTION ===================== -->
<div id="formSection" class="card">
  <h2>Student Exam Form</h2>

  <label>Student Name</label>
  <input id="name">

  <label>Roll Number</label>
  <input id="roll">

  <label>Department</label>
  <select id="dept">
    <option>Computer Science</option>
    <option>Electronics</option>
    <option>Mechanical</option>
    <option>Civil</option>
  </select>

  <label>Subject</label>
  <input id="subject">

  <label>Exam Date</label>
  <input type="date" id="date">

  <button class="submit-btn" onclick="submitForm()">Submit</button>
</div>

</body>
</html>
